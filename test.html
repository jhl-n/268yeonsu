<!DOCTYPE html>
<meta charset="utf-8">
<button id="go">기록 남기기</button>
<pre id="out">대기 중</pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = { 
    apiKey: "AIzaSyCk49EELaqWCHDHCtWzk9DvWCsLN0Oye5g",
    authDomain: "fir-classapp-8232a.firebaseapp.com",
    projectId: "fir-classapp-8232a",
    storageBucket: "fir-classapp-8232a.firebasestorage.app",
    messagingSenderId: "962804848681",
    appId: "1:962804848681:web:f20786a9e31488dff0a438"
};
const APP_ID = "demo-test-0001";          // 기록장의 앱 ID

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const out = document.getElementById("out");

await signInAnonymously(getAuth(app));
out.textContent = "로그인 완료";

document.getElementById("go").onclick = async () => {
  await addDoc(collection(db, "apps", APP_ID, "records"),
               { at: new Date().toISOString() });
  const snap = await getDocs(collection(db, "apps", APP_ID, "records"));
  out.textContent = "저장된 기록 " + snap.size + "개";
};
</script>
